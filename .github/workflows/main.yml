name: Notify MajdataView

on:
    push:
      branches:
        - master
jobs:
    notify-majdataview:
      runs-on: ubuntu-latest
      steps:
        - name: Trigger MajdataView build
          run: |
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.MAJDATAVIEW_DISPATCH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/MikiraSora/MajdataView/dispatches \
              -d '{"event_type":"majdataedit-push","client_payload":
              {"majdataedit_sha":"${{ github.sha }}","majdataedit_ref":"${{ github.ref_name }}"}}'
